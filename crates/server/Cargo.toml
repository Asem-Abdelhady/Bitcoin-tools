[package]
name = "bitcoin-tools-web-server"
description = "An axum JSON API over bitcoin-tools-core."
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# `rand` is off by default in core, deliberately: "a tool that only inspects
# should not be able to mint a secret by accident". `/keys/generate` is that
# accident made on purpose, so the server opts in and nothing else has to.
bitcoin-tools-core = { workspace = true, features = ["rand"] }

axum.workspace = true
serde.workspace = true
tokio.workspace = true
tower.workspace = true

[dev-dependencies]
bitcoin-tools-vectors.workspace = true
serde_json.workspace = true
tower = { workspace = true, features = ["util"] }
